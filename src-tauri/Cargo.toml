[package]
name = "portside-lite"
version.workspace = true
edition.workspace = true
description = "Desktop monitor and triage tool for k3s clusters"

[lib]
# The `_lib` suffix avoids a name collision with the binary on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "portside_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
portside-core = { path = "../crates/portside-core" }
portside-kube = { path = "../crates/portside-kube" }
portside-monitor = { path = "../crates/portside-monitor" }
portside-store = { path = "../crates/portside-store" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
