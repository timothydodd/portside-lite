[package]
name = "portside-monitor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
portside-core = { path = "../portside-core" }
portside-kube = { path = "../portside-kube" }
portside-store = { path = "../portside-store" }
portside-secrets = { path = "../portside-secrets" }
# Checks a copied archive against the cluster's before deleting it there (already in the tree).
sha2 = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
# Already in the tree (russh); local time for the backup schedules.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
