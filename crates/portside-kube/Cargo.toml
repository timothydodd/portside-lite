[package]
name = "portside-kube"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
futures = { workspace = true }
http = "1.5.0"
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.2.0", default-features = false, features = ["client", "rustls-tls", "ring", "ws"] }
portside-core = { path = "../portside-core" }
russh = { version = "0.65.0", default-features = false, features = ["ring", "flate2", "rsa"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9.34"
thiserror = { workspace = true }
# The node's files arrive as a .tar.gz (both already in the tree).
flate2 = "1"
tar = "0.4"
tokio = { workspace = true }
