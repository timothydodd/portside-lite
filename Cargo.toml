[workspace]
resolver = "2"
members = [
  "crates/portside-core",
  "crates/portside-kube",
  "crates/portside-store",
  "crates/portside-monitor",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
futures = "0.3"
